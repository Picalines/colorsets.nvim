[tools]
neovim = "0.12.0"
stylua = "latest"
"cargo:vimcats" = { version = "latest", features = "cli" }
"aqua:LuaLS/lua-language-server" = "latest"
watchexec = "latest"

[tasks.lint]
alias = "l"
depends = "lint:*"

[tasks."lint:format"]
sources = ["stylua.toml", "**/*.lua"]
run = "stylua --check lua/"

[tasks."lint:lsp"]
sources = ["luarc.json", "**/*.lua"]
run = '''
VIMRUNTIME=$(nvim --headless --clean -u NONE --noplugin "+lua io.write(vim.env.VIMRUNTIME)" +qa) \
  lua-language-server --check . --checklevel=Warning --configpath luarc.json
'''

[tasks.format]
alias = "f"
sources = ["stylua.toml", "**/*.lua"]
run = "stylua lua/"

[tasks.doc]
sources = ["lua/**/*.lua"]
run = '''
mkdir -p doc
vimcats \
  -f -i 2 --layout mini:2 \
  lua/*.lua \
  lua/**/*.lua \
  > doc/colorsets.txt
'''

[tasks.test]
alias = "t"
depends = ["dev-deps"]
sources = ["**/*.lua"]
run = "nvim --headless --noplugin -u ./tests/run.lua"

[tasks.dev-deps]
run = '''
mkdir -p deps
if [ ! -d deps/mini.test/.git ]; then
  git clone \
    --filter=blob:none \
    --branch stable \
    --depth 1 \
    https://github.com/nvim-mini/mini.test \
    deps/mini.test
fi
'''
